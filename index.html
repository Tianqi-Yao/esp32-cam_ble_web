<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-CAM BLE 图像传输</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #34495e;
            padding: 10px 20px;
            color: white;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #e74c3c;
            margin-right: 10px;
        }
        
        .status-dot.connected {
            background: #2ecc71;
        }
        
        .control-panel {
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #3498db;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            min-width: 120px;
        }
        
        button:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }
        
        button:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
        }
        
        button.primary {
            background: #e74c3c;
        }
        
        button.primary:hover {
            background: #c0392b;
        }
        
        .resolution-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        
        .image-container {
            padding: 20px;
            text-align: center;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        #imageDisplay {
            max-width: 100%;
            max-height: 400px;
            border: 3px solid #e9ecef;
            border-radius: 10px;
            display: none;
        }
        
        .placeholder {
            color: #7f8c8d;
            font-size: 16px;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #ecf0f1;
            border-radius: 3px;
            margin: 10px 0;
            overflow: hidden;
            display: none;
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(90deg, #3498db, #2ecc71);
            width: 0%;
            transition: width 0.3s;
        }
        
        .info-panel {
            padding: 15px;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
            font-size: 14px;
            color: #7f8c8d;
        }
        
        .log {
            background: #2c3e50;
            color: white;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 150px;
            overflow-y: auto;
            border-radius: 0 0 15px 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ESP32-CAM BLE 图像传输</h1>
            <p>通过蓝牙低功耗传输摄像头图像</p>
        </div>
        
        <div class="status-bar">
            <div class="status-info">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">未连接</span>
            </div>
            <div class="device-info" id="deviceInfo"></div>
        </div>
        
        <div class="control-panel">
            <div class="button-group">
                <button id="connectBtn" class="primary">连接设备</button>
                <button id="disconnectBtn" disabled>断开连接</button>
                <button id="captureBtn" disabled>拍摄图片</button>
            </div>
            
            <div class="resolution-buttons">
                <button data-resolution="0">VGA (640x480)</button>
                <button data-resolution="1">SVGA (800x600)</button>
                <button data-resolution="2">XGA (1024x768)</button>
                <button data-resolution="3">SXGA (1280x1024)</button>
                <button data-resolution="4">UXGA (1600x1200)</button>
            </div>
        </div>
        
        <div class="image-container">
            <div class="progress-bar" id="progressBar">
                <div class="progress" id="progress"></div>
            </div>
            <img id="imageDisplay" alt="摄像头图像">
            <div class="placeholder" id="placeholder">图像将显示在这里</div>
        </div>
        
        <div class="info-panel">
            <div>图像信息: <span id="imageInfo">等待数据...</span></div>
        </div>
        
        <div class="log" id="log"></div>
    </div>

    <script>
        const SERVICE_UUID = '19b10000-e8f2-537e-4f6c-d104768a1214';
        const IMAGE_CHAR_UUID = '19b10001-e8f2-537e-4f6c-d104768a1214';
        const CONTROL_CHAR_UUID = '19b10002-e8f2-537e-4f6c-d104768a1214';
        
        let device, server, service, imageChar, controlChar;
        let isConnected = false;
        
        let expectedSize = 0;
        let receivedSize = 0;
        let totalSegs = 0;
        let expectSeq = 0;
        let transferId = 0;
        let imageBuffer = null;
        let receiving = false;
        let lastProgressTs = 0;
        let timeoutTimer = null;
        
        // DOM
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const deviceInfo = document.getElementById('deviceInfo');
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const captureBtn = document.getElementById('captureBtn');
        const imageDisplay = document.getElementById('imageDisplay');
        const placeholder = document.getElementById('placeholder');
        const progressBar = document.getElementById('progressBar');
        const progress = document.getElementById('progress');
        const imageInfo = document.getElementById('imageInfo');
        const log = document.getElementById('log');
        
        function addLog(m){
          const t = new Date().toLocaleTimeString();
          log.textContent += `[${t}] ${m}\n`;
          log.scrollTop = log.scrollHeight;
        }
        function setConn(b){
          isConnected = b;
          statusDot.className = 'status-dot' + (b ? ' connected' : '');
          statusText.textContent = b ? '已连接' : '未连接';
          connectBtn.disabled = b;
          disconnectBtn.disabled = !b;
          captureBtn.disabled = !b;
        }
        function resetTransferUI(){
          progressBar.style.display = 'none';
          progress.style.width = '0%';
          imageInfo.textContent = '等待数据...';
        }
        function resetTransferState(){
          expectedSize = 0;
          receivedSize = 0;
          totalSegs = 0;
          expectSeq = 0;
          transferId = 0;
          imageBuffer = null;
          receiving = false;
          clearTimeout(timeoutTimer);
          timeoutTimer = null;
          resetTransferUI();
        }
        
        function armTimeout(){
          clearTimeout(timeoutTimer);
          timeoutTimer = setTimeout(async ()=>{
            if (!receiving) return;
            addLog('超时：1.5s 无新数据，发送 RETRY');
            try { await controlChar.writeValue(new TextEncoder().encode('RETRY')); } catch(e){}
          }, 1500);
        }
        
        async function connect(){
          try{
            if (!navigator.bluetooth) { alert('浏览器不支持 Web Bluetooth'); return; }
            addLog('正在搜索设备...');
            device = await navigator.bluetooth.requestDevice({
              filters: [{ name: 'ESP32-CAM-BLE' }],
              optionalServices: [SERVICE_UUID]
            });
            device.addEventListener('gattserverdisconnected', onDisconnected);
            deviceInfo.textContent = device.name || '未知设备';
        
            addLog('正在连接 GATT...');
            server = await device.gatt.connect();
            service = await server.getPrimaryService(SERVICE_UUID);
            imageChar = await service.getCharacteristic(IMAGE_CHAR_UUID);
            controlChar = await service.getCharacteristic(CONTROL_CHAR_UUID);
        
            await imageChar.startNotifications();
            imageChar.addEventListener('characteristicvaluechanged', onImageData);
        
            setConn(true);
            addLog('连接成功');
          }catch(e){
            addLog('连接失败: ' + e);
            console.error(e);
          }
        }
        function onDisconnected(){
          setConn(false);
          deviceInfo.textContent = '';
          addLog('设备断开');
          resetTransferState();
        }
        connectBtn.addEventListener('click', connect);
        disconnectBtn.addEventListener('click', ()=>{ if(server) server.disconnect(); });
        
        captureBtn.addEventListener('click', async ()=>{
          if(!controlChar) return;
          try{
            resetTransferState();
            addLog('请求拍照 C...');
            await controlChar.writeValue(new TextEncoder().encode('C'));
          }catch(e){
            addLog('发送失败: '+e);
          }
        });
        
        // 分辨率
        document.querySelectorAll('.resolution-buttons button').forEach(btn=>{
          btn.addEventListener('click', async ()=>{
            if(!controlChar || !isConnected) return;
            try{
              const code = btn.getAttribute('data-resolution');
              addLog('设置分辨率 ' + code);
              await controlChar.writeValue(new TextEncoder().encode(code));
            }catch(e){
              addLog('分辨率设置失败: '+e);
            }
          });
        });
        
        // 数据处理
        function onImageData(ev){
          const dv = ev.target.value;
          if (!dv || dv.byteLength === 0) return;
        
          // 尝试按文本解析
          if (dv.byteLength <= 64) {
            try{
              const text = new TextDecoder().decode(dv);
              if (text.startsWith('SIZE:')) {
                // SIZE:<len>:ID:<id>
                const m = text.match(/^SIZE:(\d+):ID:(\d+)/);
                if (m) {
                  expectedSize = parseInt(m[1]);
                  transferId = parseInt(m[2]);
                  imageBuffer = new Uint8Array(expectedSize);
                  receivedSize = 0;
                  expectSeq = 0;
                  receiving = true;
                  lastProgressTs = performance.now();
                  progressBar.style.display = 'block';
                  progress.style.width = '0%';
                  addLog(`开始接收：len=${expectedSize}, id=${transferId}`);
                  // 回 "GO"
                  controlChar.writeValue(new TextEncoder().encode('GO')).catch(()=>{});
                  armTimeout();
                  return;
                }
              }
              if (text.startsWith('END:')) {
                // END:<id>:<totalSegs>:<crc32>
                const m = text.match(/^END:(\d+):(\d+):(\d+)$/);
                if (m && receiving) {
                  const id = parseInt(m[1]);
                  const segs = parseInt(m[2]);
                  const crc = parseInt(m[3]);
                  if (id === transferId && segs === totalSegs && receivedSize === expectedSize) {
                    // 简易 CRC32 校验（浏览器不自带，把长度校验作为第一道关）
                    // 可选：你也可以在此引入纯 JS CRC32 校验
                    showImage(imageBuffer);
                    addLog(`接收完成: ${receivedSize} bytes`);
                    receiving = false;
                    clearTimeout(timeoutTimer);
                    return;
                  } else {
                    addLog(`END 校验失败，触发 RETRY`);
                    controlChar.writeValue(new TextEncoder().encode('RETRY')).catch(()=>{});
                    return;
                  }
                }
              }
              if (text === 'ERROR') {
                addLog('ESP32 错误');
                receiving = false;
                clearTimeout(timeoutTimer);
                return;
              }
              if (text === 'OK') {
                addLog('控制命令 OK');
                return;
              }
            }catch{}
          }
        
          // 二进制分片：2字节 seq + 数据
          if (!receiving || !imageBuffer) {
            addLog(`收到 ${dv.byteLength} 字节，但未处于接收状态`);
            return;
          }
          armTimeout();
        
          const bytes = new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength);
          if (bytes.length < 3) return;
        
          const seq = bytes[0] | (bytes[1] << 8);
          const payload = bytes.subarray(2);
        
          // 初始化 totalSegs（仅在首包时根据长度估算，或递增 seq 计算）
          if (seq === 0) {
            totalSegs = Math.ceil(expectedSize / (payload.length));
          }
        
          if (seq !== expectSeq) {
            // 简化策略：发现乱序/缺包，直接 RETRY 整帧
            addLog(`分片序号异常：期望 ${expectSeq} 实际 ${seq}，RETRY`);
            controlChar.writeValue(new TextEncoder().encode('RETRY')).catch(()=>{});
            return;
          }
        
          // 拷贝到 buffer
          const remain = expectedSize - receivedSize;
          const copyLen = Math.min(remain, payload.length);
          imageBuffer.set(payload.subarray(0, copyLen), receivedSize);
          receivedSize += copyLen;
          expectSeq++;
        
          // 进度
          const pct = (receivedSize / expectedSize) * 100;
          progress.style.width = pct + '%';
          const now = performance.now();
          if (now - lastProgressTs > 500) {
            addLog(`进度：${receivedSize}/${expectedSize} (${pct.toFixed(1)}%)`);
            lastProgressTs = now;
          }
        
          if (receivedSize >= expectedSize) {
            addLog('数据已接满，等待 END...');
          }
        }
        
        function showImage(buf){
          try{
            const blob = new Blob([buf], {type:'image/jpeg'});
            const url = URL.createObjectURL(blob);
            imageDisplay.onload = ()=>URL.revokeObjectURL(url);
            imageDisplay.onerror = ()=>URL.revokeObjectURL(url);
            imageDisplay.src = url;
            imageDisplay.style.display = 'block';
            placeholder.style.display = 'none';
            imageInfo.textContent = `大小: ${buf.length} 字节, 时间: ${new Date().toLocaleTimeString()}`;
          }catch(e){
            addLog('显示失败: '+e);
          }
        }
        
        // init
        addLog('页面加载完成，点击“连接设备”开始');
        addLog('建议使用 Chrome/Edge（支持 Web Bluetooth）');
    </script>

</body>
</html>
